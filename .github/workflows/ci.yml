name: CI

on:
  push:
    branches: [main, open-source-prep]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run test suite
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
      - name: Install package and check console scripts
        run: |
          pip install .
          context-hub --help
          context-hub-mcp --help
          context-hub-integrate --help
          python -c "import context_hub; print(context_hub.__version__)"
